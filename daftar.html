<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Taruna Cyber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>TARUNA CYBER</h1>
        <p>Komunitas IT Club Sekolah</p>
    </header>

    <!-- NAVIGASI -->
    <nav>
        <a href="index.html">Beranda</a>
        <a href="bidang.html">Bidang IT</a>
        <a href="agenda.html">Agenda</a>
        <a href="tutorial.html">Tutorial</a>
        <a href="daftar.html">Pendaftaran</a>
    </nav>

    <!-- ISI HALAMAN -->
    <main>
        <h2>Pendaftaran Anggota Baru</h2>

        <p>
            Isi formulir berikut jika kamu tertarik
            bergabung dengan Taruna Cyber.
        </p>

        <form action="#" method="post"
              style="max-width:500px; margin-top:25px;">

            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap"
                   required
                   style="width:100%; padding:10px; margin:8px 0 18px;">

            <label for="kelas">Kelas:</label>
            <input type="text" id="kelas" name="kelas"
                   placeholder="Contoh: XI RPL"
                   required
                   style="width:100%; padding:10px; margin:8px 0 18px;">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="nama@email.com"
                   required
                   style="width:100%; padding:10px; margin:8px 0 18px;">

            <label for="bidang">Pilih Bidang:</label>
            <select id="bidang" name="bidang" required
                    style="width:100%; padding:10px; margin:8px 0 18px;">
                <option value="">-- Pilih Bidang --</option>
                <option value="coding">Coding</option>
                <option value="jaringan">Jaringan</option>
                <option value="robotik">Robotik</option>
            </select>

            <label for="alasan">Alasan Bergabung:</label>
            <textarea id="alasan" name="alasan"
                      rows="4"
                      placeholder="Tuliskan alasan kamu..."
                      required
                      style="width:100%; padding:10px; margin:8px 0 18px;"></textarea>

            <button type="submit"
                    style="padding:12px 20px; background:#00e5ff;
                    color:#0b1220; border:0; border-radius:5px;
                    font-weight:bold; cursor:pointer;">
                Kirim Pendaftaran
            </button>

        </form>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Taruna Cyber. Semua Hak Dilindungi.</p>
    </footer>

</body>
</html>
